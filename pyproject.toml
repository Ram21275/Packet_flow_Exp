[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-flow-packets"
version = "0.1.0"
description = "Simulation-first sender selection and receiver reconstruction with conditional flow matching"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy>=1.26", "scipy>=1.12", "soundfile>=0.12", "datasets>=3,<5", "huggingface-hub>=0.25", "cryptography>=42", "tqdm>=4.66"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
packets-exp = "packets_exp.cli:main"

[tool.setuptools.packages.find]
include = ["packets_exp*"]
